<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A leaderboard for Codewars users, showing their ranks and points."
    />
    <title>Codewars Leaderboard</title>
    <script src="index.mjs" type="module" defer></script>
  </head>
  <body>
    <header>
      <h1>Codewars Leaderboard</h1>
    </header>
    <main>
      <section id="username-input">
        <label for="username">Enter Codewars usernames:</label>
        <textarea
          id="username"
          name="username"
          rows="4"
          cols="50"
          placeholder="For example: CodeYourFuture, 40thieves, SallyMcGrath"
        ></textarea>
        <button id="submit-btn">Submit</button>
      </section>

      <section id="language-filter"></section>

      <section id="leaderboard"></section>
    </main>
  </body>
  <footer>
    <p>
      Data provided by
      <a href="https://dev.codewars.com/#get-user" target="_blank">Codewars</a>
    </p>
  </footer>

  <script src="index.mjs" type="module" defer></script>
</html>
